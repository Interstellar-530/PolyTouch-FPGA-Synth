<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1960" viewBox="0 0 1920 1960" role="img" aria-labelledby="title desc"><title id="title">信号处理与合成算法详解</title><desc id="desc">当前生产源码 · 32 声部 / 54 MHz 计算域 / 46.875 kHz 采样率。实线为音频或事件流，虚线为控制与状态。依据当前32声部HDMI生产源码。</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9Z" fill="#007E78"/></marker><marker id="ctrl" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 9 9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9Z" fill="#2864B6"/></marker></defs>
<rect width="1920" height="1960" fill="#F8FAFD"/>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif} .line{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<text x="64" y="58" font-size="19" font-weight="600" fill="#007E78" text-anchor="start">POLYTOUCH  /  FPGA SYNTHESIZER</text>
<text x="64" y="120" font-size="44" font-weight="700" fill="#152944" text-anchor="start">信号处理与合成算法详解</text>
<text x="64" y="164" font-size="23" font-weight="400" fill="#53677E" text-anchor="start">当前生产源码 · 32 声部 / 54 MHz 计算域 / 46.875 kHz 采样率</text>
<path class="line" d="M64 194 L1856 194" stroke="#CED9E5" stroke-width="1"/>
<text x="64" y="242" font-size="25" font-weight="600" fill="#007E78" text-anchor="start">A  演奏事件与控制参数</text>
<g data-panel="统一演奏事件输入"><rect x="64" y="272" width="336" height="184" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="296" width="5" height="28" rx="2" fill="#007E78"/>
<text x="104" y="319" font-size="27" font-weight="600" fill="#152944" text-anchor="start">统一演奏事件输入</text>
<text x="88" y="360" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">手动：CH9350L / 串口</text>
<text x="88" y="394" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">自动：曲目 ROM 定时派发</text>
<text x="88" y="428" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">Note On / Off + 力度</text>
</g>
<g data-panel="事件整理与延音"><rect x="464" y="272" width="398" height="184" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="486" y="296" width="5" height="28" rx="2" fill="#007E78"/>
<text x="504" y="319" font-size="27" font-weight="600" fill="#152944" text-anchor="start">事件整理与延音</text>
<text x="488" y="360" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">仲裁 → 同音来源管理 → FIFO</text>
<text x="488" y="394" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">踏板按下：暂存 Note Off</text>
<text x="488" y="428" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">确认松开：补发 → ADSR 释音</text>
</g>
<g data-panel="跨域握手 → 声部调度"><rect x="926" y="272" width="420" height="184" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="948" y="296" width="5" height="28" rx="2" fill="#007E78"/>
<text x="966" y="319" font-size="27" font-weight="600" fill="#152944" text-anchor="start">跨域握手 → 声部调度</text>
<text x="950" y="360" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">事件与控制：27 → 54 MHz</text>
<text x="950" y="394" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">同音重触发 → 空闲 → 抢占</text>
<text x="950" y="428" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">ADSR、音高步进 × 弯音比例</text>
</g>
<g data-panel="参数更新 → 声部状态 RAM"><rect x="1410" y="272" width="446" height="184" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1432" y="296" width="5" height="28" rx="2" fill="#007E78"/>
<text x="1450" y="319" font-size="27" font-weight="600" fill="#152944" text-anchor="start">参数更新 → 声部状态 RAM</text>
<text x="1434" y="360" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音区 / 力度选表，高音增益修正</text>
<text x="1434" y="394" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">按变更声部提交配置事务</text>
<text x="1434" y="428" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">保存相位、步进、包络与选表</text>
</g>
<path class="line" d="M400 362 L454 362" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M862 362 L916 362" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M1346 362 L1400 362" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<text x="64" y="526" font-size="25" font-weight="600" fill="#007E78" text-anchor="start">B  每个采样帧依次遍历 32 个声部</text>
<path class="line" d="M1633 456 L1633 545 L210 545 L210 558" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<g data-panel="读声部状态"><rect x="64" y="570" width="294" height="198" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="594" width="5" height="28" rx="2" fill="#007E78"/>
<text x="104" y="617" font-size="27" font-weight="600" fill="#152944" text-anchor="start">读声部状态</text>
<text x="88" y="658" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">相位、步进、包络</text>
<text x="88" y="692" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">力度、波表与权重</text>
<text x="88" y="726" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">φ ← φ + Δφ</text>
</g>
<g data-panel="共享 BSRAM 查表"><rect x="410" y="570" width="320" height="198" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="432" y="594" width="5" height="28" rx="2" fill="#007E78"/>
<text x="450" y="617" font-size="27" font-weight="600" fill="#152944" text-anchor="start">共享 BSRAM 查表</text>
<text x="434" y="658" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">512 点 / 16 位波表</text>
<text x="434" y="692" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">正弦 + 乐器波表</text>
<text x="434" y="726" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">读取相邻位置与相邻表</text>
</g>
<g data-panel="两级线性插值"><rect x="782" y="570" width="322" height="198" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="804" y="594" width="5" height="28" rx="2" fill="#007E78"/>
<text x="822" y="617" font-size="27" font-weight="600" fill="#152944" text-anchor="start">两级线性插值</text>
<text x="806" y="658" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">位置：相邻采样点插值</text>
<text x="806" y="692" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音色：相邻表权重插值</text>
<text x="806" y="726" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">钢琴阶段间平滑过渡</text>
</g>
<g data-panel="包络与力度缩放"><rect x="1156" y="570" width="320" height="198" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1178" y="594" width="5" height="28" rx="2" fill="#007E78"/>
<text x="1196" y="617" font-size="27" font-weight="600" fill="#152944" text-anchor="start">包络与力度缩放</text>
<text x="1180" y="658" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">插值结果 × ADSR</text>
<text x="1180" y="692" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">再乘演奏力度</text>
<text x="1180" y="726" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">保留 24 位声部样本</text>
</g>
<g data-panel="双路 32 位累加"><rect x="1528" y="570" width="328" height="198" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1550" y="594" width="5" height="28" rx="2" fill="#007E78"/>
<text x="1568" y="617" font-size="27" font-weight="600" fill="#152944" text-anchor="start">双路 32 位累加</text>
<text x="1552" y="658" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">正弦声部求和</text>
<text x="1552" y="692" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">乐器声部求和</text>
<text x="1552" y="726" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">完成后提交主混音</text>
</g>
<path class="line" d="M358 668 L402 668" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M730 668 L774 668" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M1104 668 L1148 668" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M1476 668 L1520 668" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M1692 768 L1692 807 L211 807 L211 780" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
<text x="570" y="838" font-size="21" font-weight="400" fill="#53677E" text-anchor="start">声部状态回写相位；下一声部复用同一 ROM 与运算流水线</text>
<text x="64" y="907" font-size="25" font-weight="600" fill="#007E78" text-anchor="start">C  帧级主混音、输出与显示</text>
<g data-panel="主混音与输出整形"><rect x="64" y="942" width="382" height="202" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="966" width="5" height="28" rx="2" fill="#007E78"/>
<text x="104" y="989" font-size="27" font-weight="600" fill="#152944" text-anchor="start">主混音与输出整形</text>
<text x="88" y="1030" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">正弦 / 乐器混合权重渐变</text>
<text x="88" y="1064" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">32 声部归一化 → 主音量</text>
<text x="88" y="1098" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">平滑静音 → 24 位饱和保护</text>
<text x="88" y="1124" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">复用合成流水线空闲期乘法器</text>
</g>
<g data-panel="音频帧跨域桥"><rect x="510" y="942" width="382" height="202" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="532" y="966" width="5" height="28" rx="2" fill="#007E78"/>
<text x="550" y="989" font-size="27" font-weight="600" fill="#152944" text-anchor="start">音频帧跨域桥</text>
<text x="534" y="1030" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">完成样本：54 → 27 MHz</text>
<text x="534" y="1064" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">帧请求与结果握手同步</text>
<text x="534" y="1098" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">对齐 I2S 采样节拍</text>
</g>
<g data-panel="标准 I2S → PCM5102A"><rect x="956" y="942" width="404" height="202" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="978" y="966" width="5" height="28" rx="2" fill="#007E78"/>
<text x="996" y="989" font-size="27" font-weight="600" fill="#152944" text-anchor="start">标准 I2S → PCM5102A</text>
<text x="980" y="1030" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">24 位有效数据 / 32 位声道槽</text>
<text x="980" y="1064" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">LRCK 46.875 kHz / BCK 3 MHz</text>
<text x="980" y="1098" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">左右同样本 → DAC 模拟输出</text>
</g>
<g data-panel="状态与音频快照 → HDMI"><rect x="1424" y="942" width="432" height="202" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1446" y="966" width="5" height="28" rx="2" fill="#2864B6"/>
<text x="1464" y="989" font-size="27" font-weight="600" fill="#152944" text-anchor="start">状态与音频快照 → HDMI</text>
<text x="1448" y="1030" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">输出样本 → 波形 / 点阵</text>
<text x="1448" y="1064" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">声部 mask → 32 格活动窗</text>
<text x="1448" y="1098" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音符与力度 → 8 频带活动</text>
<text x="1448" y="1124" font-size="18" font-weight="500" fill="#2864B6" text-anchor="start">频带活动为统计值，未执行 FFT</text>
</g>
<path class="line" d="M1810 768 L1810 920 L255 920 L255 930" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M446 1038 L500 1038" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M892 1038 L946 1038" stroke="#007E78" stroke-width="3" marker-end="url(#arrow)"/>
<path class="line" d="M701 1144 L701 1184 L1640 1184 L1640 1156" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
<text x="64" y="1232" font-size="23" font-weight="400" fill="#53677E" text-anchor="start">时序预算：54,000,000 ÷ 46,875 = 1152 拍/帧；声部遍历主体 19 × 32 = 608 拍。</text>
<text x="64" y="1269" font-size="21" font-weight="400" fill="#53677E" text-anchor="start">其余时隙用于配置提交与主混音；具体吞吐和余量以完整 RTL 仿真及实现时序报告为准。</text>
<g data-panel="曲目事件 ROM → 本图 A 区输入"><rect x="64" y="1320" width="860" height="188" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="1344" width="5" height="28" rx="2" fill="#007E78"/>
<text x="104" y="1367" font-size="27" font-weight="600" fill="#152944" text-anchor="start">曲目事件 ROM → 本图 A 区输入</text>
<text x="88" y="1408" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">曲谱与编排 → Note On / Off、力度、等待、循环</text>
<text x="88" y="1442" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">song_player32 按采样节拍解码，FIFO 就绪后交付事件</text>
<text x="88" y="1488" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">只描述演奏动作和时序，不向 I2S 提供预录音频样本</text>
</g>
<g data-panel="音色波表 ROM → 本图 B 区查表"><rect x="956" y="1320" width="900" height="188" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="978" y="1344" width="5" height="28" rx="2" fill="#007E78"/>
<text x="996" y="1367" font-size="27" font-weight="600" fill="#152944" text-anchor="start">音色波表 ROM → 本图 B 区查表</text>
<text x="980" y="1408" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">512 点单周期波形按相位寻址、插值，再经 ADSR 与混音</text>
<text x="980" y="1442" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">手动演奏与自动演奏使用相同的板上逐样本合成通路</text>
<text x="980" y="1488" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">波表描述音色；演示曲事件表描述曲谱，二者职责不同</text>
</g>
<text x="64" y="1560" font-size="25" font-weight="600" fill="#007E78" text-anchor="start">D  延音踏板稳定算法：控制路径生成稳定踏板状态，送入 A 区延音逻辑</text>
<g data-panel="压力采集与快速判定"><rect x="64" y="1600" width="382" height="228" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="1624" width="5" height="28" rx="2" fill="#007E78"/>
<text x="104" y="1647" font-size="27" font-weight="600" fill="#152944" text-anchor="start">压力采集与快速判定</text>
<text x="88" y="1688" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">MCP3208 CH0，2 kHz 更新</text>
<text x="88" y="1722" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">三点中值去除孤立尖峰</text>
<text x="88" y="1756" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">踏板判定不经过显示用 IIR</text>
<text x="88" y="1808" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">快速开关与平滑显示分开处理</text>
</g>
<g data-panel="回差与连续样本确认"><rect x="510" y="1600" width="382" height="228" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="532" y="1624" width="5" height="28" rx="2" fill="#007E78"/>
<text x="550" y="1647" font-size="27" font-weight="600" fill="#152944" text-anchor="start">回差与连续样本确认</text>
<text x="534" y="1688" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">未踩：连续 2 点 ≥512 才按下</text>
<text x="534" y="1722" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">已踩：连续 6 点 ≤256 才松开</text>
<text x="534" y="1756" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">条件中断清计数；仅新样本推进</text>
<text x="534" y="1808" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">名义确认：约 1 ms / 3 ms</text>
</g>
<g data-panel="保护已保持的音符"><rect x="956" y="1600" width="404" height="228" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="978" y="1624" width="5" height="28" rx="2" fill="#007E78"/>
<text x="996" y="1647" font-size="27" font-weight="600" fill="#152944" text-anchor="start">保护已保持的音符</text>
<text x="980" y="1688" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">IdleOnly 空闲超时保留延音</text>
<text x="980" y="1722" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">明确断开 / Panic 仍紧急清音</text>
<text x="980" y="1756" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">严格策略超时仍执行清音</text>
<text x="980" y="1808" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">区分键盘空闲与真正断开</text>
</g>
<g data-panel="确认松开后有序释音"><rect x="1424" y="1600" width="432" height="228" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1446" y="1624" width="5" height="28" rx="2" fill="#007E78"/>
<text x="1464" y="1647" font-size="27" font-weight="600" fill="#152944" text-anchor="start">确认松开后有序释音</text>
<text x="1448" y="1688" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">暂存 Note Off，松踏板后补发</text>
<text x="1448" y="1722" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">仍被按住的键保留；支持背压</text>
<text x="1448" y="1756" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">同音重触发取消旧的待释音</text>
<text x="1448" y="1808" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">新 Note On 通过原事件通路</text>
</g>
<path class="line" d="M446 1715 L500 1715" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
