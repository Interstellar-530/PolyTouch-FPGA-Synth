<text x="1438" y="372" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音色混合、音量与饱和保护</text>
<text x="1438" y="406" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">24 位 / 46.875 kHz</text>
<text x="1438" y="440" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">PCM5102A → 模拟音频输出</text>
</g>
