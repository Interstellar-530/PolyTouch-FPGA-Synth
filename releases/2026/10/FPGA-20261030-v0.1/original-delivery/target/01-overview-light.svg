<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc"><title id="title">从演奏动作到声音输出</title><desc id="desc">32 声部时分复用波表合成 · 控制、音频与可视化协同运行。实线为音频或事件流，虚线为控制与状态。依据当前32声部HDMI生产源码。</desc>
