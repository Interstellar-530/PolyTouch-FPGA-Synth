<g data-panel="表情输入与稳定检测"><rect x="64" y="588" width="360" height="238" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="86" y="612" width="5" height="28" rx="2" fill="#2864B6"/>
<text x="104" y="635" font-size="27" font-weight="600" fill="#152944" text-anchor="start">表情输入与稳定检测</text>
<text x="88" y="676" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">FSR → 三点中值 → 回差</text>
<text x="88" y="710" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">按下 2 点 / 松开 6 点</text>
<text x="88" y="744" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">稳定踏板 → 手动延音</text>
<text x="88" y="778" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">旋钮 → 实时弯音比例</text>
<text x="88" y="806" font-size="18" font-weight="500" fill="#2864B6" text-anchor="start">2 kHz · 状态更新目标小于 5 ms</text>
</g>
<path class="line" d="M244 588 L244 534 L694 534 L694 494" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
<text x="395" y="524" font-size="21" font-weight="400" fill="#53677E" text-anchor="start">延音 / 弯音控制</text>
<g data-panel="演示曲构建：保存演奏信息"><rect x="514" y="588" width="810" height="178" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="536" y="612" width="5" height="28" rx="2" fill="#007E78"/>
<text x="554" y="635" font-size="27" font-weight="600" fill="#152944" text-anchor="start">演示曲构建：保存演奏信息</text>
<text x="538" y="676" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">曲谱转写与多声部编排 → 编译按键、松键、力度及等待指令</text>
<text x="538" y="710" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">事件存入 BSRAM ROM → 板上按节拍派发 → 同一合成引擎</text>
<text x="538" y="746" font-size="18" font-weight="500" fill="#007E78" text-anchor="start">曲目 ROM 存演奏指令；音色波表 ROM 存单周期波形</text>
</g>
<g data-panel="HDMI 实时显示"><rect x="1414" y="588" width="442" height="178" rx="16" fill="#FFFFFF" stroke="#CED9E5"/>
<rect x="1436" y="612" width="5" height="28" rx="2" fill="#2864B6"/>
<text x="1454" y="635" font-size="27" font-weight="600" fill="#152944" text-anchor="start">HDMI 实时显示</text>
<text x="1438" y="676" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音频波形 / 32 格声部活动</text>
<text x="1438" y="710" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">音符与力度统计 → 频带活动</text>
<text x="1438" y="746" font-size="18" font-weight="500" fill="#2864B6" text-anchor="start">显示通过快照同步，音频走独立 DAC</text>
</g>
<path class="line" d="M1635 482 L1635 575" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
<path class="line" d="M874 430 L914 430 L914 557 L1380 557 L1380 675 L1402 675" stroke="#2864B6" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#ctrl)"/>
<text x="64" y="852" font-size="23" font-weight="600" fill="#007E78" text-anchor="start">算法要点</text>
<text x="64" y="898" font-size="29" font-weight="500" fill="#152944" text-anchor="start">演示曲相当于一份自动弹奏记录：规定何时弹什么音、力度多大、何时松开。</text>
<text x="64" y="944" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">FPGA 逐声部、逐样本合成声音后输出 I2S；曲目存储不含整曲 PCM、WAV 或 MP3。</text>
