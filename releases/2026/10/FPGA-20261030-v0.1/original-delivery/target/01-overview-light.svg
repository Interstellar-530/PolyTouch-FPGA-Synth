<text x="554" y="331" font-size="27" font-weight="600" fill="#152944" text-anchor="start">32 声部调度</text>
<text x="538" y="372" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">事件仲裁、队列与延音</text>
<text x="538" y="406" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">分配 / 重触发 / 释音</text>
