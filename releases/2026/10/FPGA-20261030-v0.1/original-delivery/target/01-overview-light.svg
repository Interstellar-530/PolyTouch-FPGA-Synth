<text x="88" y="372" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">USB 键盘 / 串口演奏</text>
<text x="88" y="406" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">演示曲：定时音符事件</text>
<text x="88" y="440" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">统一送入声部合成通路</text>
