<text x="1004" y="331" font-size="27" font-weight="600" fill="#152944" text-anchor="start">共享波表流水线</text>
<text x="988" y="372" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">相位累加 → ROM 查表</text>
<text x="988" y="406" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">位置插值 + 音色阶段插值</text>
<text x="988" y="440" font-size="22" font-weight="400" fill="#53677E" text-anchor="start">包络 × 力度 → 多声部累加</text>
</g>
